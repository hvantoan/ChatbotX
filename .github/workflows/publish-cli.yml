name: Publish CLI to npm

# Publishes apps/cli to npmjs.com as `@hvantoan/inboxos`, in lockstep with the product
# release tag: tag `v1.9.0` publishes `@hvantoan/inboxos@1.9.0`.
#
# The version is NOT stored in the repo. `apps/cli/package.json` holds the
# placeholder `0.0.0-dev` and this workflow stamps the tag's version into it
# before building, so nothing has to commit a version bump back to `main`
# (which branch protection forbids) and the repo can never drift from npm.
# `apps/cli/src/index.ts` reads that stamped value for `inboxos --version`
# (the bin command stays `inboxos`; only the npm package name changed).
#
# Quality gate: ci.yml (PR/push-to-main) and release.yml's `check` job already
# run the repo-wide lint/types/test. This workflow cannot `needs:` a job in
# another workflow file, so it re-runs only the two CLI-scoped tasks, which
# cost seconds. The build runs first because the smoke test inspects dist/.
#
# Auth: NPM_TOKEN secret (classic Automation token, or a granular token that
# is allowed to bypass 2FA for these packages). setup-node's `registry-url`
# writes an .npmrc that reads NODE_AUTH_TOKEN; the publish step exports it.
#
# One-time setup:
#   1. Create an npm token that can publish `@hvantoan/inboxos` (Settings → Access
#      Tokens on npmjs.com). If the npm account enforces 2FA on writes, the
#      token must be permitted to bypass it or every publish fails EOTP.
#   2. Add it as a repository secret named NPM_TOKEN
#      (Settings → Secrets and variables → Actions).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.9.1 (a leading v is stripped)"
        required: true
        type: string
      dry_run:
        description: "Run publish with --dry-run (nothing is uploaded)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# cancel-in-progress is deliberately false: a cancelled run between the npm
# upload and the step summary leaves a published version nobody announced.
concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish inboxos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      # `registry-url` makes setup-node write an .npmrc pointing at npmjs
      # with ${NODE_AUTH_TOKEN} as the auth variable; the publish step sets
      # it from the NPM_TOKEN secret. No token is echoed into the log.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version and dist-tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW="${INPUT_VERSION}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          VERSION_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "${VERSION}" =~ ${VERSION_RE} ]]; then
            echo "::error::Invalid version '${RAW}' —" \
              "expected v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          # A prerelease tag (v2.0.0-rc.1) must never become npm's `latest`.
          if [[ "${VERSION}" == *-* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing @hvantoan/inboxos@${VERSION} under dist-tag ${DIST_TAG}"

      # Re-running a tag's workflow must not fail on E403 "cannot publish over
      # an existing version". Only guarded for tag pushes: a manual dispatch is
      # an explicit human action and should surface the duplicate as an error.
      - name: Skip when already published
        id: guard
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@hvantoan/inboxos@${VERSION}" version >/dev/null 2>&1; then
            echo "@hvantoan/inboxos@${VERSION} is already on npm — skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      # jq ships on ubuntu-latest. Not committed anywhere — the runner's copy of
      # package.json is the only thing that changes.
      - name: Stamp version into apps/cli/package.json
        if: steps.guard.outputs.should_publish != 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "${VERSION}" '.version = $v' \
            apps/cli/package.json > package.json.tmp
          mv package.json.tmp apps/cli/package.json
          echo "stamped version: $(jq -r '.version' apps/cli/package.json)"

      # Direct `tsdown` rather than `turbo run build`: the stamped package.json
      # must be inside the bundle, and this sidesteps any turbo cache question
      # entirely. Built BEFORE the tests: __tests__/smoke.test.ts asserts on
      # dist/index.cjs, which does not exist on a clean runner until now.
      - name: Build CLI
        if: steps.guard.outputs.should_publish != 'false'
        working-directory: apps/cli
        run: pnpm build

      - name: Type-check and test CLI
        if: steps.guard.outputs.should_publish != 'false'
        working-directory: apps/cli
        run: |
          pnpm check-types
          pnpm test

      # `pnpm pack`, then `npm publish <tarball>`: package.json uses pnpm-only
      # specs (`catalog:`, `workspace:`) that `npm publish` would ship verbatim,
      # leaving the package uninstallable. `pnpm pack` rewrites them to concrete
      # versions. A tarball publish runs no lifecycle scripts, so the version
      # check that `prepublishOnly` does is repeated against the tarball here.
      - name: Pack tarball
        id: pack
        if: steps.guard.outputs.should_publish != 'false'
        working-directory: apps/cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACK_DIR="${RUNNER_TEMP}/npm-pack"
          rm -rf "${PACK_DIR}"
          mkdir -p "${PACK_DIR}"
          pnpm pack --pack-destination "${PACK_DIR}"
          TARBALL="$(find "${PACK_DIR}" -maxdepth 1 -name '*.tgz' -print -quit)"
          if [[ -z "${TARBALL}" ]]; then
            echo "::error::pnpm pack produced no tarball in ${PACK_DIR}"
            exit 1
          fi
          MANIFEST="$(tar -xOf "${TARBALL}" package/package.json)"
          PACKED_VERSION="$(jq -r '.version' <<<"${MANIFEST}")"
          if [[ "${PACKED_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Tarball version '${PACKED_VERSION}'" \
              "does not match '${VERSION}'"
            exit 1
          fi
          LEAKED="$(jq -r '
            [
              .dependencies, .devDependencies,
              .peerDependencies, .optionalDependencies
            ]
            | map(select(. != null) | to_entries[]) | .[]
            | select(.value | test("^(catalog|workspace):"))
            | "\(.key)@\(.value)"' <<<"${MANIFEST}")"
          if [[ -n "${LEAKED}" ]]; then
            echo "::error::Tarball package.json still has" \
              "pnpm-only specs: ${LEAKED//$'\n'/, }"
            exit 1
          fi
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        id: publish
        if: steps.guard.outputs.should_publish != 'false'
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ARGS=(--access public --tag "${DIST_TAG}")
          if [[ "${DRY_RUN}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          npm publish "${TARBALL}" "${ARGS[@]}"

      # Lets ChatbotXIO/chatbotx-agent's upstream-drift-check workflow run
      # immediately instead of waiting for its next scheduled run. Optional:
      # skipped entirely (via `continue-on-error` swallowing the failure)
      # when INBOXOS_AGENT_DISPATCH_TOKEN isn't configured, so this publish
      # never fails just because that repo hasn't been wired up yet.
      #
      # One-time setup required before this does anything:
      #   1. Create a fine-grained GitHub PAT scoped to ONLY the
      #      ChatbotXIO/chatbotx-agent repository, with "Contents: write"
      #      permission (needed to create a repository_dispatch event) and
      #      no other scopes.
      #   2. Add it as a secret named INBOXOS_AGENT_DISPATCH_TOKEN on this
      #      repository (Settings → Secrets and variables → Actions).
      # The receiving workflow is .github/workflows/upstream-drift.yml in
      # chatbotx-agent, listening for event_type "upstream-published".
      - name: Notify chatbotx-agent of the new CLI publish
        if: >-
          steps.guard.outputs.should_publish != 'false'
          && inputs.dry_run != true
          && steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.INBOXOS_AGENT_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "INBOXOS_AGENT_DISPATCH_TOKEN not set —" \
              "skipping chatbotx-agent notification." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api repos/ChatbotXIO/chatbotx-agent/dispatches \
            -f event_type=upstream-published \
            -f "client_payload[package]=@hvantoan/inboxos" \
            -f "client_payload[version]=${VERSION}"

      - name: Summarize
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          SHOULD_PUBLISH: ${{ steps.guard.outputs.should_publish }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          if [[ "${SHOULD_PUBLISH}" == "false" ]]; then
            echo "@hvantoan/inboxos@${VERSION} already published — skipped." \
              >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${PUBLISH_OUTCOME}" == "failure" ]]; then
            echo "Publish failed for @hvantoan/inboxos@${VERSION} —" \
              "nothing was confirmed uploaded; check the" \
              "\"Publish to npm\" step log." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${DRY_RUN}" == "true" ]]; then
            echo "Dry run for @hvantoan/inboxos@${VERSION} (${DIST_TAG})" \
              "— nothing uploaded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published" \
              "https://www.npmjs.com/package/@hvantoan/inboxos/v/${VERSION}" \
              "(dist-tag \`${DIST_TAG}\`)" >> "$GITHUB_STEP_SUMMARY"
          fi
