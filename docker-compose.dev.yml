name: chatbotx

include:
  - docker-compose.yml

x-service-common: &service-common
  platform: linux/amd64
  restart: unless-stopped
  env_file:
    # Base env (secrets, feature flags). Generate from .env.example if missing.
    - ./.env
    # Local-docker overrides generated by scripts/stack-up.sh (container
    # hostnames, mailhog SMTP, local RustFS). Last file wins in compose.
    - path: ./.env.docker
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - chatbotx-network

x-worker-common: &worker-common
  <<: *service-common
  build:
    context: .
    dockerfile: apps/worker/docker/Dockerfile

services:
  builder:
    <<: *service-common
    # image: chatbotx-builder:latest
    build:
      context: .
      dockerfile: apps/builder/docker/Dockerfile
    # 3123 is published by the caddy service below, which routes /ws to
    # realtime exactly like prod (NPM) does. The dev-only Next rewrite is not
    # in the production build, so publishing the builder here would hide that.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      filesystem:
        condition: service_healthy
    healthcheck:
      # The release image has no curl, and the Next standalone server binds
      # the container hostname (not localhost).
      test: ["CMD", "node", "-e", "fetch('http://'+process.env.HOSTNAME+':3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - RUN_DB_MIGRATE=true
      - RUN_DB_SEED=true

  # BullMQ Worker
  worker:
    <<: *worker-common
    networks:
      - chatbotx-network
      - javascript-executor-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      filesystem:
        condition: service_healthy
      javascript-executor:
        condition: service_healthy
    environment:
      - JAVASCRIPT_EXECUTOR_URL=http://javascript-executor:3210

  javascript-executor:
    platform: linux/amd64
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/javascript-executor/docker/Dockerfile
    environment:
      JAVASCRIPT_EXECUTOR_TOKEN: ${JAVASCRIPT_EXECUTOR_TOKEN:-change-me-in-production-at-least-32-chars}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
    networks:
      - javascript-executor-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
          pids: 128
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  realtime:
    <<: *service-common
    build:
      context: .
      dockerfile: apps/realtime/docker/Dockerfile
    ports:
      - "1999:1999"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_BUILDER_URL: http://builder:3000
      REALTIME_BUILDER_URL: http://builder:3000

  # Local ingress, mirroring prod: NPM forwards /ws/ to realtime and the rest
  # to builder. The builder's /ws rewrite exists only in `next dev`.
  caddy:
    <<: *service-common
    image: caddy:2-alpine
    ports:
      - "3123:3123"
    depends_on:
      builder:
        condition: service_healthy
      realtime:
        condition: service_started
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

configs:
  caddyfile:
    content: |
      :3123 {
        handle_path /ws/* {
          reverse_proxy realtime:1999
        }
        handle {
          reverse_proxy builder:3000
        }
      }

networks:
  javascript-executor-network:
    driver: bridge
    internal: true
