name: chatbotx-prod

x-network: &network
  networks:
    - chatbotx-network

x-service-common: &service-common
  platform: linux/amd64
  restart: always
  env_file:
    - path: ../.env
      required: false
  networks:
    - chatbotx-network

# Cloudflare R2 (S3-compatible object storage)
# S3_ENDPOINT=https://<ACCOUNT_ID>.r2.cloudflarestorage.com
# S3_REGION=auto
x-storage-environment: &storage-environment
  S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}

# Resend SMTP (used by @chatbotx.io/mail in builder and worker)
# SMTP_SERVER=smtps://resend:<RESEND_API_KEY>@smtp.resend.com:465
# SMTP_FROM=ChatbotX <no-reply@your-verified-domain.com>
x-mail-environment: &mail-environment
  SMTP_SERVER: ${SMTP_SERVER:?SMTP_SERVER is required}
  SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}

services:
  # ─────────────────────────────────────────────
  # Infrastructure (Prod - internal only; R2 is external)
  # ─────────────────────────────────────────────
  postgres:
    <<: *network
    image: timescale/timescaledb-ha:pg18-all
    restart: always
    volumes:
      - db-data-prod:/home/postgres/pgdata
    command: ["postgres", "-c", "log_statement=none"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    <<: *network
    image: redis:8-alpine
    restart: always
    volumes:
      - cache-data-prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Applications (Prod - hardened)
  # ─────────────────────────────────────────────
  builder:
    <<: *service-common
    image: ${CHATBOTX_BUILDER_IMAGE:-ghcr.io/${GHCR_NAMESPACE:-hvantoan}/chatbotx-builder:${CHATBOTX_IMAGE_TAG:-latest}}
    ports:
      - "${BUILDER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      <<: [*storage-environment, *mail-environment]
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      RUN_DB_MIGRATE: ${RUN_DB_MIGRATE:-false}
      RUN_DB_SEED: "false"
      ZALO_PERSONAL_GATEWAY_URL: http://zalo-personal-gateway:3220
    deploy:
      resources:
        limits:
          memory: 2G

  worker:
    <<: *service-common
    image: ${CHATBOTX_WORKER_IMAGE:-ghcr.io/${GHCR_NAMESPACE:-hvantoan}/chatbotx-worker:${CHATBOTX_IMAGE_TAG:-latest}}
    networks:
      - chatbotx-network
      - javascript-executor-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      javascript-executor:
        condition: service_healthy
    environment:
      <<: [*storage-environment, *mail-environment]
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      JAVASCRIPT_EXECUTOR_URL: http://javascript-executor:3210
      ZALO_PERSONAL_GATEWAY_URL: http://zalo-personal-gateway:3220
    deploy:
      resources:
        limits:
          memory: 2G

  javascript-executor:
    platform: linux/amd64
    restart: always
    image: ${CHATBOTX_JS_EXECUTOR_IMAGE:-ghcr.io/${GHCR_NAMESPACE:-hvantoan}/chatbotx-javascript-executor:${CHATBOTX_IMAGE_TAG:-latest}}
    environment:
      NODE_ENV: production
      JAVASCRIPT_EXECUTOR_TOKEN: ${JAVASCRIPT_EXECUTOR_TOKEN:?JAVASCRIPT_EXECUTOR_TOKEN is required}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-2}
    networks:
      - javascript-executor-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
          pids: 128
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  realtime:
    <<: *service-common
    image: ${CHATBOTX_REALTIME_IMAGE:-ghcr.io/${GHCR_NAMESPACE:-hvantoan}/chatbotx-realtime:${CHATBOTX_IMAGE_TAG:-latest}}
    ports:
      - "${REALTIME_PORT:-1999}:1999"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_BUILDER_URL: http://builder:3000
      REALTIME_BUILDER_URL: http://builder:3000

  zalo-personal-gateway:
    <<: *service-common
    image: ${CHATBOTX_ZALO_PERSONAL_GATEWAY_IMAGE:-ghcr.io/${GHCR_NAMESPACE:-hvantoan}/chatbotx-zalo-personal-gateway:${CHATBOTX_IMAGE_TAG:-latest}}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3220
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - ZALO_PERSONAL_GATEWAY_TOKEN=${ZALO_PERSONAL_GATEWAY_TOKEN:?ZALO_PERSONAL_GATEWAY_TOKEN is required}
      - ZALO_PERSONAL_WEBHOOK_SECRET=${ZALO_PERSONAL_WEBHOOK_SECRET:?ZALO_PERSONAL_WEBHOOK_SECRET is required}
      - ZALO_PERSONAL_PROXY_URL=${ZALO_PERSONAL_PROXY_URL:-}
      - ZALO_PERSONAL_MAX_ACCOUNTS=${ZALO_PERSONAL_MAX_ACCOUNTS:-5}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3220/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  chatbotx-network:
    driver: bridge
  javascript-executor-network:
    driver: bridge
    internal: true

volumes:
  db-data-prod:
  cache-data-prod:
